name: Parity

# Flatpack must answer exactly what plain Statamic answers. Each job installs a fresh Statamic app
# at one version, runs it twice (plain Statamic as the oracle, and with Flatpack), and compares
# reads, saves, a rebuild, and files changed on disk followed by flatpack:refresh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'   # daily: a new Statamic release is caught the day it's tagged

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { statamic: '5.11.0', php: '8.2', name: 'Statamic 5 (earliest supported)' }
          - { statamic: '^5.0', php: '8.3', name: 'Statamic 5 (latest)' }
          - { statamic: '^6.0', php: '8.4', name: 'Statamic 6 (latest)' }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, opcache
          tools: composer:v2
          coverage: none

      - name: Parity
        run: bin/parity '${{ matrix.statamic }}' "$RUNNER_TEMP/parity"

      - name: Keep the dumps when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ strategy.job-index }}
          path: ${{ runner.temp }}/parity/out

  # Statamic's next release, before it's tagged: its 6.x branch. A failure here is the warning
  # that the next Statamic release will pause Flatpack (or worse), so a fix can ship with it.
  # Not run on pull requests, where it would fail them for changes outside this repo.
  upcoming:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Statamic 6 (unreleased, 6.x-dev)
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcntl, opcache
          tools: composer:v2
          coverage: none

      - name: Parity
        run: bin/parity '6.x-dev' "$RUNNER_TEMP/parity"

      - name: Keep the dumps when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-upcoming
          path: ${{ runner.temp }}/parity/out
